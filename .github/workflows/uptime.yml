# Внешняя проверка сайтов сервера 161.97.68.205 раз в 5 минут — логика в check.py, список — sites.json.
# Боты без сайта и контейнеры проверяет сторож на самом сервере (~/scripts/services-watchdog.py).
name: uptime
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Прислать тестовое сообщение в Telegram"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: uptime
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - id: run
        name: Проверка
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TEST: ${{ inputs.test || false }}
        run: python3 check.py
      - name: Сохранить состояние / keepalive
        run: |
          git config user.name uptime-bot; git config user.email uptime-bot@users.noreply.github.com
          last=$(git log -1 --format=%ct); age=$(( ($(date +%s) - last) / 86400 ))
          if [ "${{ steps.run.outputs.changed }}" = "true" ]; then
            git add state.json; git commit -qm "state"; git push -q
          elif [ $age -ge 30 ]; then
            # GitHub выключает плановые запуски в репозитории без коммитов 60 дней
            git commit -q --allow-empty -m "keepalive"; git push -q
          fi
